<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <title>OG · Per molts anys, Júlia!</title>
    <!-- Fuente de public/og.png. Renderizar con: npm run og (Playwright, 1200×630) -->
    <style>
      @font-face {
        font-family: 'Shrikhand';
        src: url('../node_modules/@fontsource/shrikhand/files/shrikhand-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'DM Mono';
        font-weight: 500;
        src: url('../node_modules/@fontsource/dm-mono/files/dm-mono-latin-500-normal.woff2') format('woff2');
      }
      :root {
        --bg: #1a0b2e;
        --bg2: #2a0f4a;
        --pink: #ff3d8b;
        --yellow: #ffd23f;
        --cyan: #2de2e6;
        --orange: #ff7a2f;
        --ink: #fff7ec;
        --display: 'Shrikhand', Georgia, serif;
        --mono: 'DM Mono', ui-monospace, monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
      }
      .stage {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(720px 720px at 10% 0%, #ff3d8b55, transparent 60%),
          radial-gradient(660px 660px at 100% 30%, #2de2e644, transparent 60%),
          radial-gradient(720px 720px at 40% 110%, #ffd23f33, transparent 60%),
          linear-gradient(160deg, var(--bg), var(--bg2));
      }
      .stage::after {
        content: '';
        position: absolute;
        inset: 0;
        background-image: radial-gradient(#ffffff14 1px, transparent 1.5px);
        background-size: 22px 22px;
      }
      .note {
        position: absolute;
        font-size: 30px;
        color: #fff;
        opacity: 0.35;
      }

      /* vinilo */
      .vinyl {
        position: absolute;
        left: -90px;
        top: 95px;
        width: 440px;
        height: 440px;
        border-radius: 50%;
        background: repeating-radial-gradient(circle at 50% 50%, #111 0 2px, #1d1d1d 2px 4px);
        box-shadow:
          0 0 0 6px #0005,
          0 30px 60px #0008,
          inset 0 0 0 1px #fff1;
      }
      .vinyl::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          transparent 0 20%,
          #ffffff22 25%,
          transparent 32% 70%,
          #ffffff18 75%,
          transparent 82%
        );
      }
      .label {
        position: absolute;
        inset: 31%;
        border-radius: 50%;
        background: conic-gradient(var(--pink), var(--orange), var(--yellow), var(--pink));
        display: grid;
        place-items: center;
        font-family: var(--display);
        font-size: 82px;
        color: var(--bg);
        box-shadow: inset 0 0 0 3px #0003;
      }
      .label::after {
        content: '';
        position: absolute;
        width: 8%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--bg);
      }
      .label span {
        transform: translateY(-6%);
      }

      /* texto */
      .txt {
        position: absolute;
        left: 400px;
        top: 0;
        width: 340px;
      }
      .kicker {
        position: absolute;
        top: 120px;
        left: 0;
        white-space: nowrap;
        font-family: var(--mono);
        font-size: 18px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--yellow);
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      .kicker::before {
        content: '';
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--yellow);
      }
      h1 {
        position: absolute;
        top: 160px;
        left: 0;
        width: 340px;
        font-family: var(--display);
        font-weight: 400;
        font-size: 96px;
        line-height: 0.95;
        text-shadow:
          4px 4px 0 var(--pink),
          8px 8px 0 #00000055;
      }
      .sign {
        position: absolute;
        top: 550px;
        left: 0;
        white-space: nowrap;
        font-family: var(--display);
        font-size: 30px;
        color: var(--cyan);
      }

      /* polaroids */
      .polaroid {
        position: absolute;
        background: #fffaf2;
        padding: 10px 10px 38px;
        border-radius: 4px;
        box-shadow: 0 18px 40px #0009;
      }
      .polaroid img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 2px;
      }
      .p1 {
        left: 866px;
        top: 36px;
        width: 276px;
        height: 238px;
        transform: rotate(5deg);
      }
      .p2 {
        left: 836px;
        top: 296px;
        width: 248px;
        height: 276px;
        transform: rotate(-4deg);
      }
      .p1 img {
        object-position: 62% 50%;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <span class="note" style="left: 372px; top: 48px">♪</span>
      <span class="note" style="left: 562px; top: 540px">♩</span>
      <span class="note" style="left: 880px; top: 566px">♫</span>

      <div class="vinyl"><div class="label"><span>19</span></div></div>

      <div class="txt">
        <span class="kicker">En directe · 19 anys de gira</span>
        <h1>Per molts anys, Júlia!</h1>
        <p class="sign">De part dels teus cosins 🎤</p>
      </div>

      <div class="polaroid p1"><img src="../public/img/foto-07.jpg" alt="" /></div>
      <div class="polaroid p2"><img src="../public/img/foto-09.jpg" alt="" /></div>
    </div>
  </body>
</html>
